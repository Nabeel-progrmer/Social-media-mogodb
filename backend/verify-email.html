<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your email</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f5f9; color: #172033; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 440px); padding: 36px; border: 1px solid #e5e9f0; border-radius: 20px; background: white; box-shadow: 0 18px 55px #14213d12; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { color: #687386; }
      label { display: block; margin: 18px 0 6px; font-weight: 600; }
      input { width: 100%; padding: 13px 14px; border: 1px solid #cfd6e2; border-radius: 10px; font: inherit; }
      input[name=otp] { letter-spacing: .35em; font-size: 22px; text-align: center; }
      button { width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 10px; background: #315efb; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button.secondary { border: 1px solid #cfd6e2; background: white; color: #315efb; }
      button:disabled { opacity: .6; cursor: wait; }
      #status { min-height: 24px; margin: 14px 0 0; }
      #status.error { color: #bf2e36; }
      #status.success { color: #16804a; }
      @media (max-width: 480px) { main { padding: 26px 20px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Verify your email</h1>
      <p>Enter the six-digit code we sent to your email. The code expires in 10 minutes.</p>
      <form id="verify-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <label for="otp">Verification code</label>
        <input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="••••••" required />
        <button type="submit">Verify email</button>
        <button class="secondary" id="resend" type="button">Resend code</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const form = document.querySelector("#verify-form");
      const emailInput = document.querySelector("#email");
      const otpInput = document.querySelector("#otp");
      const status = document.querySelector("#status");
      const resend = document.querySelector("#resend");
      emailInput.value = new URLSearchParams(location.search).get("email") || "";

      async function request(path, body) {
        const response = await fetch(`/api/v1/${path}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || "Request failed");
        return result;
      }
      function show(message, type) {
        status.textContent = message;
        status.className = type || "";
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        try {
          const result = await request("verify-email", { email: emailInput.value, otp: otpInput.value });
          show(result.message + " You can close this page and sign in.", "success");
          otpInput.value = "";
        } catch (error) { show(error.message, "error"); }
        finally { button.disabled = false; }
      });
      resend.addEventListener("click", async () => {
        resend.disabled = true;
        try {
          const result = await request("send-otp", { email: emailInput.value });
          show(result.message, "success");
        } catch (error) { show(error.message, "error"); }
        finally { resend.disabled = false; }
      });
    </script>
  </body>
</html>
